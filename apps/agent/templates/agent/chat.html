{% extends "base.html" %}

{% block title %}迦勒底智能终端{% endblock %}

{% block content %}
<style>
    #agent-chat .agent-header-title,
    #agent-chat #agent-conversation-title {
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
    }

    #agent-chat .agent-intro,
    #agent-chat .agent-status {
        color: #e2e8f0;
    }

    #agent-chat .agent-messages {
        min-height: 220px;
        max-height: 58vh;
        margin: 0 0 18px;
        padding: 16px;
        overflow-y: auto;
        border: 1px solid rgba(196, 181, 253, .32);
        border-radius: 8px;
        background: rgba(15, 23, 42, .72);
    }

    #agent-chat .agent-status {
        margin: 0 0 12px;
        font-size: 13px;
    }

    #agent-chat .agent-status-error {
        color: #fca5a5;
    }

    #agent-chat .agent-message {
        margin: 0 0 14px;
        padding: 11px 14px;
        border-radius: 8px;
        color: #f8fafc;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    #agent-chat .agent-user-message {
        background: rgba(91, 33, 182, .5);
    }

    #agent-chat .agent-assistant-message {
        background: rgba(30, 41, 59, .9);
    }

    #agent-chat .agent-conversation-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
    }

    #agent-chat .agent-conversation-toolbar h2 {
        margin: 0;
    }

    #agent-chat .agent-message-label {
        display: block;
        margin-bottom: 4px;
        color: #fef3c7;
    }

    #agent-chat .agent-markdown h2,
    #agent-chat .agent-markdown h3,
    #agent-chat .agent-markdown h4 {
        margin: 8px 0;
        color: #fef3c7;
        font-weight: 700;
    }

    #agent-chat .agent-markdown p {
        margin: 0 0 8px;
    }

    #agent-chat .agent-markdown ul {
        margin: 4px 0 10px;
        padding-left: 22px;
    }

    #agent-chat .agent-markdown li {
        margin: 3px 0;
        list-style-type: disc;
    }

    #agent-chat .agent-markdown li.agent-ordered-item {
        list-style-type: decimal;
    }

    #agent-chat .agent-markdown code {
        padding: 2px 5px;
        border-radius: 4px;
        color: #fef3c7;
        background: rgba(15, 23, 42, .8);
    }

    #agent-chat .agent-markdown a {
        color: #93c5fd;
        text-decoration: underline;
    }
</style>
<main id="agent-chat" class="fgo-page">
    <div class="container">
        <div class="row">
            <div class="col-md-10 col-md-offset-1">
                <header class="fgo-card">
                    <h1 class="fgo-section-header agent-header-title">迦勒底智能终端</h1>
                    <p class="agent-intro">Chaldea Agent 将帮助你查询和理解 FGO 游戏知识。</p>
                </header>

                <section class="fgo-card" aria-labelledby="agent-conversation-title">
                    <div class="agent-conversation-toolbar">
                        <h2 id="agent-conversation-title">Chaldea Agent</h2>
                        <button id="agent-new-chat" class="btn btn-default btn-sm" type="button">新对话</button>
                    </div>
                    <div id="agent-messages" class="agent-messages" aria-live="polite">
                        <p id="agent-status" class="agent-status" data-state="idle" role="status">Agent 服务状态：等待首次请求。</p>
                    </div>

                    <form id="agent-composer" class="input-group" method="post"
                        action="{% url 'agent_api:chat_stream' %}">
                        {% csrf_token %}
                        <label class="sr-only" for="agent-input">输入问题</label>
                        <input id="agent-input" class="form-control" type="text" name="message"
                            placeholder="输入你的 FGO 问题" autocomplete="off" required>
                        <span class="input-group-btn">
                            <button id="agent-send" class="btn btn-default" type="submit">发送</button>
                        </span>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>
<script>
    (function () {
        const composer = document.getElementById("agent-composer");
        const input = document.getElementById("agent-input");
        const sendButton = document.getElementById("agent-send");
        const newChatButton = document.getElementById("agent-new-chat");
        const messages = document.getElementById("agent-messages");
        const status = document.getElementById("agent-status");
        const csrfToken = composer.querySelector("[name=csrfmiddlewaretoken]").value;
        const endpoint = composer.action;
        // Browser-local MVP state only; this is not account-backed history.
        const localStorageKey = "chaldea_agent_chat_v1";
        const STORAGE_VERSION = 1;
        const MAX_STORED_MESSAGES = 50;
        const MAX_STORED_CONTENT_LENGTH = 8000;
        const MAX_STORED_STATE_LENGTH = 100000;
        let conversationId = null;
        let persistedMessages = [];

        function storageAvailable() {
            try {
                const probeKey = localStorageKey + "_probe";
                window.localStorage.setItem(probeKey, "1");
                window.localStorage.removeItem(probeKey);
                return true;
            } catch (error) {
                return false;
            }
        }

        function trimStoredMessages(state) {
            const messagesToKeep = Array.isArray(state.messages) ? state.messages : [];
            const normalized = messagesToKeep.filter(function (message) {
                return message &&
                    (message.role === "user" || message.role === "assistant") &&
                    typeof message.content === "string" &&
                    message.content.length <= MAX_STORED_CONTENT_LENGTH;
            }).slice(-MAX_STORED_MESSAGES);
            const candidate = {
                version: STORAGE_VERSION,
                conversation_id: typeof state.conversation_id === "string" && state.conversation_id.length <= 256
                    ? state.conversation_id
                    : null,
                messages: normalized,
                updated_at: typeof state.updated_at === "string" ? state.updated_at : new Date().toISOString()
            };
            while (normalized.length && JSON.stringify(candidate).length > MAX_STORED_STATE_LENGTH) {
                normalized.shift();
            }
            return candidate;
        }

        function readLocalState() {
            if (!storageAvailable()) return null;
            try {
                const raw = window.localStorage.getItem(localStorageKey);
                if (!raw || raw.length > MAX_STORED_STATE_LENGTH) return null;
                const state = JSON.parse(raw);
                if (!state || typeof state !== "object" || state.version !== STORAGE_VERSION ||
                    !Array.isArray(state.messages) ||
                    (state.conversation_id !== null && typeof state.conversation_id !== "string") ||
                    (typeof state.conversation_id === "string" && state.conversation_id.length > 256)) {
                    return null;
                }
                return trimStoredMessages(state);
            } catch (error) {
                return null;
            }
        }

        function persistState() {
            if (!storageAvailable()) return;
            const state = trimStoredMessages({
                version: STORAGE_VERSION,
                conversation_id: conversationId,
                messages: persistedMessages,
                updated_at: new Date().toISOString()
            });
            try {
                const serialized = JSON.stringify(state);
                if (serialized.length <= MAX_STORED_STATE_LENGTH) {
                    window.localStorage.setItem(localStorageKey, serialized);
                }
            } catch (error) {
                // Browser storage is optional; continue with in-memory chat state.
            }
        }

        function restoreLocalState() {
            const state = readLocalState();
            if (!state) return;
            conversationId = state.conversation_id;
            persistedMessages = state.messages;
            persistedMessages.forEach(function (message) {
                addMessage(
                    message.role === "user" ? "你" : "Agent",
                    message.content,
                    message.role === "user" ? "agent-user-message" : "agent-assistant-message",
                    message.role === "assistant"
                );
            });
        }

        function resetLocalState() {
            conversationId = null;
            persistedMessages = [];
            try {
                window.localStorage.removeItem(localStorageKey);
            } catch (error) {
                // Browser storage is optional; the reset still applies in memory.
            }
            messages.querySelectorAll(".agent-message").forEach(function (message) {
                message.remove();
            });
            setStatus("Agent 服务状态：等待首次请求。", "idle");
            input.focus();
        }

        function renderMarkdown(text) {
            const escaped = String(text).replace(/[&<>"']/g, function (character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[character];
            });
            const links = [];
            let markdown = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, label, url) {
                const token = "__AGENT_LINK_" + links.length + "__";
                links.push({ token: token, label: label, url: url });
                return token;
            });
            markdown = markdown.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, function (_, prefix, url) {
                return prefix + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + "</a>";
            });
            markdown = markdown
                .replace(/^### (.+)$/gm, "<h4>$1</h4>")
                .replace(/^## (.+)$/gm, "<h3>$1</h3>")
                .replace(/^# (.+)$/gm, "<h2>$1</h2>")
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                .replace(/\*([^*]+)\*/g, "<em>$1</em>")
                .replace(/^\d+\. (.*)$/gm, '<li class="agent-ordered-item">$1</li>')
                .replace(/^(?:- )(.*)$/gm, "<li>$1</li>")
                .replace(/\n/g, "<br>");
            links.forEach(function (link) {
                markdown = markdown.replace(
                    link.token,
                    '<a href="' + link.url + '" target="_blank" rel="noopener noreferrer">' + link.label + "</a>"
                );
            });
            return markdown;
        }

        function addMessage(label, text, className, markdown) {
            const message = document.createElement("div");
            message.className = "agent-message " + className;
            const prefix = document.createElement("strong");
            prefix.className = "agent-message-label";
            prefix.textContent = label + "：";
            message.appendChild(prefix);
            const body = document.createElement("div");
            body.className = markdown ? "agent-markdown" : "agent-plain-text";
            if (markdown) {
                body.innerHTML = renderMarkdown(text);
            } else {
                body.textContent = text;
            }
            message.appendChild(body);
            messages.appendChild(message);
            message.scrollIntoView({ block: "nearest" });
            return { message: message, body: body };
        }

        function setStatus(message, state) {
            status.textContent = message;
            status.dataset.state = state;
            status.className = "agent-status agent-status-" + state;
        }

        function setBusy(isBusy) {
            input.disabled = isBusy;
            sendButton.disabled = isBusy;
            newChatButton.disabled = isBusy;
        }

        function parseSseFrame(frame, dispatch) {
            let eventType = "message";
            const dataLines = [];
            frame.split("\n").forEach(function (line) {
                if (line.indexOf("event:") === 0) {
                    eventType = line.slice(6).trim();
                } else if (line.indexOf("data:") === 0) {
                    dataLines.push(line.slice(5).replace(/^ /, ""));
                }
            });
            if (!dataLines.length) return;
            try {
                dispatch(eventType, JSON.parse(dataLines.join("\n")));
            } catch (error) {
                // Ignore malformed frames; the stream completion check reports
                // an interrupted response if no valid done/error event arrives.
            }
        }

        async function readStream(response, handleEvent) {
            if (!response.body || !response.body.getReader) {
                throw new Error("stream_unavailable");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";
            let completed = false;
            let failed = false;

            function consume(text) {
                buffer += text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
                const frames = buffer.split("\n\n");
                buffer = frames.pop();
                frames.forEach(function (frame) {
                    parseSseFrame(frame, function (eventType, data) {
                        if (failed && eventType !== "error") return;
                        if (eventType === "done") completed = true;
                        if (eventType === "error") failed = true;
                        handleEvent(eventType, data);
                    });
                });
            }

            while (true) {
                const result = await reader.read();
                if (result.done) break;
                consume(decoder.decode(result.value, { stream: true }));
            }
            consume(decoder.decode());
            if (buffer.trim()) {
                parseSseFrame(buffer, function (eventType, data) {
                    if (failed && eventType !== "error") return;
                    if (eventType === "done") completed = true;
                    if (eventType === "error") failed = true;
                    handleEvent(eventType, data);
                });
            }
            return { completed: completed, failed: failed };
        }

        function scrollMessages() {
            messages.scrollTop = messages.scrollHeight;
        }

        async function submitMessage(message) {
            addMessage("你", message, "agent-user-message", false);
            persistedMessages.push({ role: "user", content: message });
            persistState();
            const assistant = addMessage("Agent", "", "agent-assistant-message", false);
            assistant.body.style.whiteSpace = "pre-wrap";
            input.value = "";
            setStatus("Agent 正在思考……", "pending");
            setBusy(true);

            const payload = { message: message };
            if (conversationId) payload.conversation_id = conversationId;
            let assistantText = "";
            let streamError = false;

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let messageText = "Agent 服务暂时不可用，请稍后重试。";
                    try {
                        const data = await response.json();
                        const knownCodes = ["agent_not_configured", "agent_stream_error", "invalid_request", "method_not_allowed"];
                        if (
                            data &&
                            knownCodes.indexOf(data.code) !== -1 &&
                            typeof data.message === "string"
                        ) {
                            messageText = data.message;
                        }
                    } catch (error) {
                        // Ignore non-JSON error bodies such as proxy HTML.
                    }
                    setStatus(messageText, "error");
                    return;
                }

                const result = await readStream(response, function (eventType, data) {
                    if (!data || typeof data !== "object") return;
                    if (eventType === "start") {
                        setStatus("Agent 正在思考……", "pending");
                    } else if (eventType === "delta" && typeof data.text === "string") {
                        assistantText += data.text;
                        assistant.body.textContent = assistantText;
                        setStatus("Agent 正在输出……", "pending");
                        scrollMessages();
                    } else if (eventType === "done") {
                        if (
                            (data.conversation_id !== null && typeof data.conversation_id !== "string") ||
                            (data.message_id !== null && typeof data.message_id !== "string") ||
                            !assistantText.trim()
                        ) {
                            streamError = true;
                            return;
                        }
                        conversationId = data.conversation_id || null;
                        persistedMessages.push({ role: "assistant", content: assistantText });
                        persistState();
                        assistant.body.className = "agent-markdown";
                        assistant.body.style.whiteSpace = "";
                        assistant.body.innerHTML = renderMarkdown(assistantText);
                        setStatus("Agent 服务已连接。", "connected");
                        scrollMessages();
                    } else if (eventType === "error") {
                        streamError = true;
                    }
                });

                if (streamError || result.failed || !result.completed) {
                    setStatus("Agent 服务暂时不可用，请稍后重试。", "error");
                }
            } catch (error) {
                setStatus("Agent 服务暂时不可用，请稍后重试。", "error");
            } finally {
                setBusy(false);
                input.focus();
            }
        }

        composer.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = input.value.trim();
            if (!message || sendButton.disabled) return;
            submitMessage(message);
        });

        newChatButton.addEventListener("click", function () {
            if (sendButton.disabled) return;
            resetLocalState();
        });

        restoreLocalState();
    }());
</script>
{% endblock %}
